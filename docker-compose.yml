services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supplyflow
      POSTGRES_USER: supplyflow
      POSTGRES_PASSWORD: supplyflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplyflow -d supplyflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: supplyflow
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://supplyflow:supplyflow@postgres:5432/supplyflow
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: supplyflow
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost,http://localhost:5173
      JWT_SECRET: supplyflow-demo-secret-change-me
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      OPERATOR_USERNAME: operator
      OPERATOR_PASSWORD: operator123
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  mongo_data:
  redis_data:
